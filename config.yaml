# ============================================================
# AIC 2026 Vòng Sơ Tuyển — Baseline Config
# ============================================================

# --- Retrieval Backend ---
retrieval_backend: "milvus"

# --- Paths ---
data:
  root: "./DATASET"
  videos_dir: "Videos"
  keyframes_dir: "Keyframes"
  objects_dir: "Objects"
  metadata_dir: "Metadata"
  clip_features_npy: "clip_features.npy"

  npy_dirs:
    - "./clip-features-32-aic25-b1/clip-features-32"
    
  # Trỏ vào thư mục chứa trực tiếp video folders (L21_V001, L21_V002...)
  keyframes_dirs_list:
    - "./DATASET/Keyframes_L21/keyframes"
    - "./DATASET/Keyframes_L22/keyframes"
    - "./DATASET/Keyframes_L23/keyframes"

  keyframes_root: "./DATASET"

index:
  # Milvus Lite Config
  milvus_db_path: "aic_kis_database_siglip.db"
  milvus_collection: "kis_keyframes_siglip"

  # FAISS (fallback)
  faiss_index_path: "./indexes/clip_faiss.index"
  frame_map_path:   "./indexes/frame_map.json"
  bm25_corpus_path: "./indexes/bm25_corpus.json"

# --- CLIP Model ---
clip:
  model_name: "google/siglip-base-patch16-224"
  device: "cuda"

# --- Retrieval ---
retrieval:
  top_k_clip: 500
  top_k_bm25: 200
  top_k_object: 200
  final_top_k: 100
  clip_weight: 0.7
  bm25_weight: 0.3

# --- VQA ---
vqa:
  model: "Salesforce/blip2-opt-2.7b"
  device: "cuda"
  top_k_frames: 5

# --- TRAKE ---
trake:
  top_k_per_event: 300

# --- Submission ---
submission:
  output_dir: "./submissions"
  max_answers_per_query: 100
