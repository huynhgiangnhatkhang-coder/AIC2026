name: aic2026

channels:
  - defaults

dependencies:
  - python=3.10
  - pip

  - pip:
    # ── PyTorch + CUDA 11.8 ───────────────────────────────────
    - --extra-index-url https://download.pytorch.org/whl/cu118
    - torch==2.2.1+cu118
    - torchvision==0.17.1+cu118
    - torchaudio==2.2.1+cu118

    # ── CLIP (OpenAI) ─────────────────────────────────────────
    - git+https://github.com/openai/CLIP.git
    # Nếu không clone được GitHub: open_clip_torch>=2.24.0

    # ── Milvus Lite ───────────────────────────────────────────
    - pymilvus>=2.4.0

    # ── Vector Search (FAISS) ─────────────────────────────────
    - faiss-gpu-cu11          # FAISS build cho CUDA 11.x
    # CPU fallback: faiss-cpu

    # ── Transformers / VQA ────────────────────────────────────
    - transformers==4.40.0
    - accelerate==0.27.0
    - sentencepiece>=0.1.99
    - tokenizers>=0.19.0

    # ── Image ─────────────────────────────────────────────────
    - Pillow>=10.0.0
    - opencv-python-headless>=4.8.0

    # ── Data ──────────────────────────────────────────────────
    - numpy>=1.24.0,<2.0.0
    - pandas>=2.0.0
    - scikit-learn>=1.3.0
    - scipy>=1.11.0

    # ── BM25 ──────────────────────────────────────────────────
    - rank-bm25>=0.2.2

    # ── FastAPI ───────────────────────────────────────────────
    - fastapi>=0.110.0
    - uvicorn[standard]>=0.27.0
    - python-multipart>=0.0.9
    - pydantic>=2.0.0

    # ── Utilities ─────────────────────────────────────────────
    - PyYAML>=6.0
    - tqdm>=4.66.0
    - requests>=2.31.0
    - python-dotenv>=1.0.0
